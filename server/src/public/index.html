<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>callgate</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>callgate</h1>
    <p id="status-banner" class="status status-idle">Loading status&hellip;</p>
  </header>

  <main>
    <section>
      <h2>Allowed numbers</h2>
      <p class="hint">Only these numbers (plus 911, always) can call in or be called out to.</p>
      <table id="numbers-table">
        <thead>
          <tr><th>Label</th><th>Number</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <form id="add-form">
        <input type="text" id="add-label" placeholder="Label (e.g. Grandma)" />
        <input type="tel" id="add-number" placeholder="Phone number" required />
        <button type="submit">Add</button>
      </form>
      <button id="sync-now-btn" type="button">Sync now</button>
    </section>

    <section>
      <h2>Call log</h2>
      <table id="call-log-table">
        <thead>
          <tr><th>When</th><th>Direction</th><th>Number</th><th>Duration</th><th>Allowed?</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
